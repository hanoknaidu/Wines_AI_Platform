[project]
name = "wines-ai-backend"
version = "0.1.0"
description = "Wines AI API - conversational wine recommendation over a frozen, reviewed dataset"
requires-python = ">=3.12"

# Base dependencies are deliberately small: no anthropic, no torch, no
# sentence-transformers, no vector database - and lane 3 did not change that. The
# orchestrated engine's default provider is `offline`, which runs the whole A-to-K
# pipeline with no key and no network, so the install that has to boot still carries
# nothing that calls out. Keeping it that way is the first cost control in the project
# and what keeps NFR-4 (no credentials) true unless someone deliberately sets a key.
#
# What the pipeline needed instead of those wheels: BM25 (orchestrator/retrieval/bm25.py,
# ~90 lines) and a hashed n-gram embedder (embed.py, ~80), both behind protocols a real
# FTS5 index and a real bi-encoder drop into. Each file states what it gives up.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
# Lane 4: the real models. The orchestrated engine runs without this extra on its
# offline provider; installing it is what lets WA_LLM_PROVIDER=anthropic work.
#
# `langgraph` was declared here and has been dropped. The graph it would express has
# one decision point, and the checkpointer it would provide is `graph_checkpoint`,
# which lane 2 already writes - so it would have bought a dependency and a second
# state representation for a four-way dispatch. orchestrator/graph.py states the
# reasoning and keeps the node structure explicit, which is what the diagram's state
# machine was actually for. If the graph grows a cycle, a join, or human-in-the-loop
# interrupts, that is when it earns itself back.
# `langchain-anthropic` makes the router's Haiku call (orchestrator/gateway/
# langchain_router.py). It runs INSIDE the gateway, so the router still counts toward
# the per-turn ceiling, the breaker and the cost trace. Same extra as `anthropic`, so
# the base install still carries nothing that calls out.
orchestrator = ["anthropic>=0.40", "langchain-anthropic>=1.7"]
# Real retrieval: embedded Qdrant (in-process, no server) for the dense arm, fastembed's
# ONNX bge-small-en-v1.5 (384-d) embeddings, and an ONNX MS-MARCO cross-encoder for
# stage G. No torch. Models download once (~200 MB) on first boot. Without this extra,
# WA_RETRIEVAL_BACKEND=auto falls back to the hashed embedder + feature scorer.
retrieval = ["qdrant-client[fastembed]>=1.12"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wines_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
