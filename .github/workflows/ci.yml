name: CI

# Runs on every PR into main (the merge gate) and again on main after merge.
# No path filters on purpose: these jobs are required status checks, and a
# filtered-out required check never reports, which blocks the PR forever.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.7"      # same uv as the Dockerfile
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"       # same Node as frontend/Dockerfile
  # Pinned so a new tool release cannot turn the merge gate red on its own.
  MYPY_VERSION: "2.4.1"
  BANDIT_VERSION: "1.9.4"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  # ---------------------------------------------------------------- backend
  backend-lint:
    name: Backend / lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lockfile matches pyproject
        run: uv lock --check
      - name: ruff check
        run: uv run --frozen --extra dev ruff check . --output-format github
      - name: ruff format --check
        run: uv run --frozen --extra dev ruff format --check --diff .
      # Report only: the two steps above are the gate.
      - name: Lint HTML report
        if: always()
        run: |
          mkdir -p reports
          uv run --frozen --extra dev ruff check . --output-format json --exit-zero > reports/ruff.json
          python scripts/ci_html_report.py ruff reports/ruff.json reports/lint.html
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-lint-report
          path: backend/reports/lint.html
          retention-days: 14

  backend-typecheck:
    name: Backend / type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # `orchestrator` so the anthropic/langchain types are real, not Any.
      # Config (and the baseline of exempt modules) is [tool.mypy] in pyproject.toml.
      # lxml is what mypy's --html-report needs.
      - name: mypy
        run: >
          uv run --frozen --extra dev --extra orchestrator
          --with mypy==${{ env.MYPY_VERSION }} --with lxml
          mypy --html-report reports/mypy
      - name: Upload type-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-typecheck-report
          path: backend/reports/mypy/
          retention-days: 14

  backend-security:
    name: Backend / security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: mkdir -p reports
      # Code scan. The HTML lists every finding; the gate fails on medium+ severity
      # only (-ll), so low-severity notes (e.g. `random` for sampling) don't block.
      - name: bandit (HTML report)
        if: always()
        run: uvx bandit==${{ env.BANDIT_VERSION }} -c pyproject.toml -r src -f html -o reports/bandit.html --exit-zero
      - name: bandit (gate, medium+ severity)
        run: uvx bandit==${{ env.BANDIT_VERSION }} -c pyproject.toml -r src -ll
      # Dependency scan of exactly what ships: the locked runtime + orchestrator deps,
      # no dev tools. --no-deps because the export is already the full resolved set.
      - name: pip-audit
        if: always()
        run: |
          uv export --frozen --extra orchestrator --no-hashes --no-emit-project -o reports/requirements.txt
          set +e
          uvx pip-audit==${{ env.PIP_AUDIT_VERSION }} -r reports/requirements.txt \
            --disable-pip --no-deps -f json -o reports/pip-audit.json
          rc=$?
          set -e
          python scripts/ci_html_report.py pip-audit reports/pip-audit.json reports/dependencies.html
          exit $rc
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-security-reports
          path: |
            backend/reports/bandit.html
            backend/reports/dependencies.html
          retention-days: 14

  backend-test:
    name: Backend / unit tests
    runs-on: ubuntu-latest
    # The suite takes ~1 min; a hang should fail fast, not burn 20.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # `orchestrator` is needed by tests/test_langchain_router.py. No API key is
      # set: the suite runs on the offline provider and makes no network calls.
      - name: Install
        run: uv sync --frozen --extra dev --extra orchestrator
      # -v names each test as it starts, and the per-test timeout fails a hung test
      # with every thread's stack dumped, so a hang points at where it was stuck.
      - name: pytest
        run: >
          uv run --frozen --extra dev --extra orchestrator
          --with pytest-cov --with pytest-html
          pytest -v -p no:cacheprovider
          --timeout=120 --timeout-method=thread
          --junitxml=reports/junit.xml
          --html=reports/tests.html --self-contained-html
          --cov=wines_ai --cov-report=term --cov-report=html:reports/coverage
      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/reports/
          retention-days: 14
      - name: Test summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists("reports/junit.xml"):
              print("### Backend tests\nNo junit report: pytest did not finish (see the pytest step log).")
              sys.exit(0)
          r = ET.parse("reports/junit.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          print("### Backend tests")
          print(f"tests: {s.get('tests')} · failures: {s.get('failures')} · errors: {s.get('errors')} · skipped: {s.get('skipped')}")
          print("\nHTML test + coverage reports: see the `backend-test-reports` artifact.")
          PY

  backend-docker:
    name: Backend / docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: wines-ai-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # --------------------------------------------------------------- frontend
  frontend-checks:
    name: Frontend / typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test

  frontend-docker:
    name: Frontend / docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: wines-ai-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
