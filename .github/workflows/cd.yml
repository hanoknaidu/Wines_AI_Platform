name: CD

# Deploys to AKS after CI passes on main (or by hand from the Actions tab).
# Images are tagged with the full git SHA, never `latest`, so every deploy is
# traceable to a commit and a rollback is just re-running an older SHA.
#
# Repo settings needed (Settings -> Secrets and variables -> Actions), see CD_readme.md step 9:
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: ACR_NAME, AKS_RG, AKS_NAME
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to deploy (default: main)"
        required: false
        default: main

# One deploy at a time; a queued one waits rather than cancelling a rollout mid-way.
concurrency:
  group: cd-aks
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC login to Azure, no stored password

env:
  NAMESPACE: wines-ai

jobs:
  deploy:
    name: Build, push to ACR, deploy to AKS
    # Only after a green CI run that came from a push to main (not a PR run).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # workflow_run fires in the context of main's HEAD; check out the exact commit CI tested.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: Resolve image tag and registry
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=${{ vars.ACR_NAME }}.azurecr.io" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v4

      # Same Dockerfiles and the same GHA cache scopes as ci.yml, so these builds
      # mostly reuse layers CI already produced. AKS nodes are amd64.
      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.registry }}/wines-ai-backend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.registry }}/wines-ai-frontend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RG }}
          cluster-name: ${{ vars.AKS_NAME }}
          admin: false
          use-kubelogin: true

      - uses: azure/setup-kubectl@v4

      # The cookie secret is created once, in-cluster, and never overwritten or logged.
      # To rotate it: kubectl -n wines-ai delete secret backend-secret, then re-run CD.
      - name: Ensure namespace and backend-secret exist
        run: |
          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"
          if ! kubectl -n "$NAMESPACE" get secret backend-secret >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" create secret generic backend-secret \
              --from-literal=WA_COOKIE_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          fi

      - name: Apply manifests with the new image tags
        working-directory: k8s
        run: |
          kustomize edit set image \
            wines-ai-backend=${{ steps.meta.outputs.registry }}/wines-ai-backend:${{ steps.meta.outputs.sha }} \
            wines-ai-frontend=${{ steps.meta.outputs.registry }}/wines-ai-frontend:${{ steps.meta.outputs.sha }}
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/backend  --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deploy/frontend --timeout=180s

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe deploy/backend deploy/frontend || true
          kubectl -n "$NAMESPACE" logs deploy/backend --tail=100 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -30 || true

      # Smoke test through the public IP: proves LB -> nginx -> backend -> db all work.
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            IP=$(kubectl -n "$NAMESPACE" get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && break
            sleep 10
          done
          [ -n "$IP" ] || { echo "No external IP assigned to svc/frontend"; exit 1; }
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "http://$IP/api/v1/readyz"
          echo
          {
            echo "### Deployed \`${{ steps.meta.outputs.sha }}\`"
            echo "App: http://$IP"
          } >> "$GITHUB_STEP_SUMMARY"
