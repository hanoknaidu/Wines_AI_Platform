# Must stay at 1 replica with Recreate: SQLite takes one writer, the SSE bus is
# in-process, and the RWO disk cannot attach to two pods during a rolling update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {app: backend}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                 # makes the mounted /data writable
      terminationGracePeriodSeconds: 40  # > GRACEFUL_TIMEOUT (30s) for open SSE streams
      containers:
        - name: backend
          image: wines-ai-backend       # tag set by cd.yml (kustomize edit set image)
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /api/v1/readyz, port: 8010}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/healthz, port: 8010}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
